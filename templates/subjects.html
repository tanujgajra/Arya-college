{% extends "base.html" %}
{% block title %}Subjects{% endblock %}
{% block content %}
<div class="form-card card">
    <h1>Subjects</h1>
    <form method="post" class="inline-form">
        <input name="subject_name" placeholder="Subject name" required>
        <input name="subject_code" placeholder="Code e.g. DSA" required>
        <button class="btn primary" type="submit">Add Subject</button>
    </form>
</div>
<div class="table-wrap card">
<table><thead><tr><th>Code</th><th>Subject</th></tr></thead><tbody>
{% for subject in subjects %}<tr><td>{{ subject['subject_code'] }}</td><td>{{ subject['subject_name'] }}</td></tr>{% else %}<tr><td colspan="2">No subjects found.</td></tr>{% endfor %}
</tbody></table>
</div>
{% endblock %}
