<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}College Attendance System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="brand">College Attendance System</div>
        {% if session.get('role') %}
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            {% if session.get('role') == 'admin' %}
                <a href="{{ url_for('students') }}">Students</a>
                <a href="{{ url_for('add_student') }}">Add Student</a>
                <a href="{{ url_for('subjects') }}">Subjects</a>
            {% endif %}
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
        {% endif %}
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
